<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spraakgestuurde Dartteller (X01)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1 { color: #f39c12; font-size: 26px; margin-bottom: 15px; }
        .setup-container, .game-container {
            max-width: 680px;
            margin: 15px auto;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
            text-align: left;
            position: relative;
        }
        .setup-container h2 { text-align: center; color: #f39c12; }
        label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; color: #ddd; }
        input, select, button {
            padding: 10px 14px;
            font-size: 15px;
            margin: 6px 0;
            border-radius: 6px;
            border: none;
            width: 100%;
            box-sizing: border-box;
        }
       input, select { background: #2c2c2c; color: white; border: 1px solid #444; }
button { 
    background: #e74c3c; 
    color: white; 
    cursor: pointer; 
    font-weight: bold; 
    width: auto; 
    height: 42px; 
    box-sizing: border-box; 
    display: inline-flex; 
    align-items: center; 
    justify-content: center; 
    vertical-align: middle; 
    margin: 0; 
}
button:hover { opacity: 0.9; }
.btn-start { background: #27ae60; font-size: 16px; padding: 0 16px; }
.btn-undo { background: #e67e22; }

        /* Compacte / Vierkante knoppen */
        .btn-square {
            width: 42px !important;
            height: 42px !important;
            padding: 0 !important;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: #8e44ad;
            border-radius: 6px;
        }
        .btn-fullscreen {
            background: #2980b9;
        }

        /* TV Scoreboard Layout */
        .tv-board {
            background: #111;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 10px;
        }
        .tv-header {
            background: #252525;
            color: #f39c12;
            padding: 8px;
            font-weight: bold;
            font-size: 16px;
            text-align: center;
            border-bottom: 2px solid #333;
            letter-spacing: 1px;
        }
        .tv-row-header {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 2fr;
            background: #1a1a1a;
            padding: 6px 10px;
            font-weight: bold;
            font-size: 13px;
            color: #888;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .tv-row-header div:first-child { text-align: left; padding-left: 10px; }
        
        .player-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 2fr;
            padding: 12px 10px;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid #222;
            background: #181818;
            position: relative;
        }
        .player-row.active {
            background: #242010;
            border-left: 5px solid #f39c12;
        }
        .p-name {
            text-align: left;
            font-weight: bold;
            font-size: 18px;
            padding-left: 5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .active-dot {
            width: 10px;
            height: 10px;
            background: #f39c12;
            border-radius: 50%;
            display: inline-block;
            visibility: hidden;
        }
        .player-row.active .active-dot { visibility: visible; }
        .p-stat { font-size: 22px; font-weight: bold; color: #2ecc71; }
        .p-score { font-size: 32px; font-weight: bold; color: #f39c12; }
        
        .checkout-bar {
            grid-column: span 4;
            text-align: right;
            font-size: 12px;
            color: #2ecc71;
            padding: 2px 10px 0 0;
            font-weight: bold;
            min-height: 16px;
        }

        /* Gesplitste Geschiedenis */
        .history-grid {
            display: flex;
            gap: 15px;
            margin-top: 15px;
        }
        .history-box {
            flex: 1;
            background: #252525;
            padding: 10px;
            border-radius: 8px;
            max-height: 140px;
            overflow-y: auto;
        }
        .history-box h4 {
            margin: 0 0 6px 0;
            color: #f39c12;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 13px;
        }
        .history-list li {
            padding: 3px 0;
            border-bottom: 1px solid #333;
            text-align: center;
        }

        #status { font-style: italic; color: #bdc3c7; margin-top: 12px; font-size: 14px; text-align: center; }
        #transcript { background: #252525; padding: 8px; border-radius: 6px; margin-top: 8px; color: #3498db; font-weight: bold; font-size: 14px; text-align: center; }

        /* Winnaar Banner */
        #winnerBanner {
            display: none;
            background: #f39c12;
            color: #000;
            padding: 15px;
            font-size: 22px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }

        /* Modal Venster voor Statistieken */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #1e1e1e;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            border: 1px solid #444;
            color: white;
            text-align: left;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }
        .modal-header h3 { margin: 0; color: #f39c12; }
        .close-btn {
            background: transparent;
            color: #aaa;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            width: auto;
            padding: 0;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        .stats-table th, .stats-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .stats-table th { color: #888; }
    </style>
</head>
<body>

    <h1>Spraakgestuurde Dartteller</h1>

    <!-- Instellingen Menu -->
    <div id="setupDiv" class="setup-container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 style="margin: 0;">Spelinstellingen</h2>
            <button class="btn-square btn-fullscreen" onclick="toggleFullscreen()" title="Volledig Scherm">⛶</button>
        </div>
        
        <label for="spelMode">Kies Spel:</label>
        <select id="spelMode">
            <option value="501">501</option>
            <option value="301">301</option>
            <option value="tactics">Tactics</option>
        </select>

        <label for="setsMode">Wedstrijdlengte (Sets):</label>
        <select id="setsMode">
            <option value="3">First to 3 Sets (3 Legs = 1 Set)</option>
            <option value="5">First to 5 Sets (3 Legs = 1 Set)</option>
            <option value="7">First to 7 Sets (3 Legs = 1 Set)</option>
            <option value="1">1 Set (First to 3 Legs)</option>
        </select>

        <label for="player1Input">Naam Speler 1:</label>
        <input type="text" id="player1Input" value="Frans">

        <label for="player2Input">Naam Speler 2:</label>
        <input type="text" id="player2Input" value="Patrick">

        <button class="btn-start" onclick="startSpel()">Start Wedstrijd</button>
    </div>

    <!-- Scorebord -->
    <div id="gameDiv" class="game-container" style="display:none;">
        
        <div id="winnerBanner">🏆 <span id="winnerText"></span> GEWONNEN! 🏆</div>

        <div class="tv-board">
            <div id="tvHeaderTitle" class="tv-header">First to 3 Sets</div>
            <div class="tv-row-header">
                <div>Darter</div>
                <div>Sets</div>
                <div>Legs</div>
                <div>Score</div>
            </div>

            <!-- Speler 1 Rij -->
            <div id="rowP1" class="player-row active">
                <div class="p-name"><span class="active-dot"></span><span id="nameP1">Frans</span></div>
                <div id="setsP1" class="p-stat">0</div>
                <div id="legsP1" class="p-stat">0</div>
                <div id="scoreP1" class="p-score">501</div>
                <div id="checkoutP1" class="checkout-bar">-</div>
            </div>

            <!-- Speler 2 Rij -->
            <div id="rowP2" class="player-row">
                <div class="p-name"><span class="active-dot"></span><span id="nameP2">Patrick</span></div>
                <div id="setsP2" class="p-stat">0</div>
                <div id="legsP2" class="p-stat">0</div>
                <div id="scoreP2" class="p-score">501</div>
                <div id="checkoutP2" class="checkout-bar">-</div>
            </div>
        </div>

        <!-- Knoppen balk -->
        <div style="margin-top: 15px; text-align: center; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center;">
            <button class="btn-start" onclick="toggleLuisteren()" id="listenBtn" style="width: auto;">Start Luisteren 🎙️</button>
            <button class="btn-undo" onclick="laatsteActieTerugdraaien()">Herstel / Terug ↩️</button>
            <button class="btn-square" onclick="openStatsModal()" title="Onderlinge Stand (Head-to-Head)">⚡</button>
            <button class="btn-square btn-fullscreen" onclick="toggleFullscreen()" title="Volledig Scherm">⛶</button>
            <button onclick="resetSpel()" style="background: #7f8c8d; width: auto;">Reset Leg</button>
            <button onclick="terugNaarInstellingen()" style="background: #34495e; width: auto;">Menu ⚙️</button>
        </div>

        <div id="status">Microfoon staat uit. Klik op 'Start Luisteren'.</div>
        <div id="transcript">Gehoord: (wacht op commando...)</div>

        <!-- Gesplitste Geschiedenis -->
        <div class="history-grid">
            <div class="history-box">
                <h4 id="histTitleP1">Frans</h4>
                <ul id="historyListP1" class="history-list">
                    <li style="color: #666;">Nog niks gegooid</li>
                </ul>
            </div>
            <div class="history-box">
                <h4 id="histTitleP2">Patrick</h4>
                <ul id="historyListP2" class="history-list">
                    <li style="color: #666;">Nog niks gegooid</li>
                </ul>
            </div>
        </div>
    </div>

    <!-- Modal voor Head-to-Head Statistieken -->
    <div id="statsModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Onderlinge Stand ⚡</h3>
                <button class="close-btn" onclick="closeStatsModal()">✖</button>
            </div>
            <div id="statsBody">
                <!-- Dynamische vulling via JS -->
            </div>
        </div>
    </div>

    <script>
        let huidigSpel = "501";
        let targetSets = 3;
        let spelers = { name1: "frans", name2: "patrick", name1Mooi: "Frans", name2Mooi: "Patrick" };
        let scores = { score1: 501, score2: 501 };
        let legs = { leg1: 0, leg2: 0 };
        let sets = { set1: 0, set2: 0 };
        let actieveSpeler = 1;
        let geschiedenisStappen = []; 
        let isLuisteren = false;
        let microphoneError = false;
        let recognition;

        const checkouts = {

            119: "T19, T12, D16", 118: "T20, 18, D20",  117: "T20, 17, D20",  116: "T20, 16, D20",  115: "T20, 15, D20",

            104: "T18, 18, D16",  103: "T19, 10, D18",  102: "T20, 10, D16",  101: "T20, 11, D16",  100: "T20, D20",
             99: "T19, 10, D16",   98: "T20, D19",        97: "T19, D20",        96: "T20, D18",        95: "T19, D19",

             84: "T20, D12",       83: "T17, D16",        82: "T14, D20",        81: "T19, D12",        80: "T20, D10",
             79: "T13, D20",       78: "T18, D12",        77: "T19, D10",        76: "T20, D8",         75: "T17, D12",
             74: "T14, D16",       73: "T19, D8",         72: "16, Bull",        71: "T13, D16",        70: "T18, D8",
             69: "T19, D6",        68: "20, D24",         67: "17, Bull",        66: "10, Bull",        65: "T15, D10",
             64: "16, D24",        63: "13, Bull",        62: "10, D26",         61: "25, D18",         60: "20, D20",
             59: "19, D20",        58: "18, D20",         57: "17, D20",         56: "16, D20",         55: "15, D20",
             54: "14, D20",        53: "13, D20",         52: "12, D20",         51: "19, D16",         50: "10, D20",
             49: "9, D20",         48: "16, D16",         47: "7, D20",          46: "6, D20",          45: "13, D16",
             44: "4, D20",         43: "3, D20",          42: "10, D16",         41: "9, D16",          40: "D20",
             39: "7, D16",         38: "D19",             37: "5, D16",          36: "D18",             35: "3, D16",
             34: "D17",            33: "1, D16",          32: "D16",             31: "15, D8",          30: "D15",
             29: "13, D8",         28: "D14",             27: "7, D10",          26: "D13",             25: "9, D8",
             24: "D12",            23: "7, D8",           22: "D11",             21: "5, D8",           20: "D10",
             19: "3, D8",          18: "D9",              17: "1, D8",           16: "D8",              15: "7, D4",
             14: "D7",             13: "5, D4",           12: "D6",              11: "3, D4",           10: "D5",
              9: "1, D4",           8: "D4",               7: "3, D2",            6: "D3",               5: "1, D2",
              4: "D2",              3: "1, D1",            2: "D1"
        };

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    alert(`Kan niet naar volledig scherm schakelen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        }

        function startSpel() {
            huidigSpel = document.getElementById('spelMode').value;
            
            if (huidigSpel === 'tactics') {
                window.location.href = 'tactics.html';
                return;
            }

            targetSets = parseInt(document.getElementById('setsMode').value, 10);

            let p1Input = document.getElementById('player1Input').value.trim() || "Speler 1";
            let p2Input = document.getElementById('player2Input').value.trim() || "Speler 2";

            spelers.name1 = p1Input.toLowerCase();
            spelers.name2 = p2Input.toLowerCase();
            spelers.name1Mooi = p1Input.charAt(0).toUpperCase() + p1Input.slice(1);
            spelers.name2Mooi = p2Input.charAt(0).toUpperCase() + p2Input.slice(1);

            document.getElementById('nameP1').innerText = spelers.name1Mooi;
            document.getElementById('nameP2').innerText = spelers.name2Mooi;
            document.getElementById('histTitleP1').innerText = spelers.name1Mooi;
            document.getElementById('histTitleP2').innerText = spelers.name2Mooi;
            document.getElementById('tvHeaderTitle').innerText = `First to ${targetSets} Sets`;

            let startScore = parseInt(huidigSpel, 10);
            scores.score1 = startScore;
            scores.score2 = startScore;
            legs = { leg1: 0, leg2: 0 };
            sets = { set1: 0, set2: 0 };

            wisseGeschiedenis();

            document.getElementById('setupDiv').style.display = 'none';
            document.getElementById('gameDiv').style.display = 'block';
            document.getElementById('winnerBanner').style.display = 'none';

            updateScherm();
            initSpraak();
        }

        function terugNaarInstellingen() {
            if (isLuisteren) { toggleLuisteren(); }
            document.getElementById('gameDiv').style.display = 'none';
            document.getElementById('setupDiv').style.display = 'block';
        }

        function initSpraak() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                alert("Je browser ondersteunt geen spraakherkenning. Gebruik Google Chrome of Microsoft Edge.");
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'nl-NL';
            recognition.continuous = true;
            recognition.interimResults = false;

            recognition.onresult = function(event) {
                const speechResult = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                document.getElementById('transcript').innerText = `Gehoord: "${speechResult}"`;
                verwerkSpraak(speechResult);
            };

            recognition.onerror = function(event) { 
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    microphoneError = true;
                    isLuisteren = false;
                    document.getElementById('listenBtn').innerText = "Start Luisteren 🎙️️";
                    document.getElementById('listenBtn').style.background = "#27ae60";
                    document.getElementById('status').innerText = "Microfoon geblokkeerd of geen toestemming verkregen.";
                }
            };

            recognition.onend = function() {
                if (isLuisteren && !microphoneError) { 
                    setTimeout(() => {
                        if (isLuisteren) { try { recognition.start(); } catch (e) {} }
                    }, 400);
                }
            };
        }

        function toggleLuisteren() {
            if (!isLuisteren) {
                microphoneError = false;
                isLuisteren = true;
                try { recognition.start(); } catch(e) {}
                document.getElementById('listenBtn').innerText = "Stop Luisteren ⏹️";
                document.getElementById('listenBtn').style.background = "#c0392b";
                document.getElementById('status').innerText = `Luistert... Zeg bijv: "${spelers.name1Mooi} 60", "${spelers.name1Mooi} dubbel 16" of "${spelers.name1Mooi} 3 keer 20"`;
            } else {
                isLuisteren = false;
                try { recognition.stop(); } catch(e) {}
                document.getElementById('listenBtn').innerText = "Start Luisteren 🎙️";
                document.getElementById('listenBtn').style.background = "#27ae60";
                document.getElementById('status').innerText = "Microfoon uitgeschakeld.";
            }
        }

        function verwerkSpraak(zin) {
            if (zin.includes("herstel") || zin.includes("fout") || zin.includes("terug") || zin.includes("ongedaan")) {
                laatsteActieTerugdraaien();
                return;
            }

            const bevatNaam1 = zin.includes(spelers.name1);
            const bevatNaam2 = zin.includes(spelers.name2);
            if (!bevatNaam1 && !bevatNaam2) return;

            let doelSpeler = bevatNaam1 ? 1 : 2;
            let spelerNaamMooi = bevatNaam1 ? spelers.name1Mooi : spelers.name2Mooi;
            actieveSpeler = doelSpeler;

            let gegooideScore = 0;

            if (zin.includes("rode boel") || zin.includes("bullseye") || (zin.includes("bull") && !zin.includes("groene") && !zin.includes("single"))) {
                gegooideScore = 50;
            } else if (zin.includes("groene boel") || zin.includes("single bull")) {
                gegooideScore = 25;
            } else {
                let vermenigvuldiger = 1;
                if (zin.includes("dubbel") || zin.includes("double") || zin.includes("2 keer") || zin.includes("2 maal") || zin.includes("2x")) {
                    vermenigvuldiger = 2;
                } else if (zin.includes("trippel") || zin.includes("triple") || zin.includes("3 keer") || zin.includes("3 maal") || zin.includes("3x")) {
                    vermenigvuldiger = 3;
                }

                const getallenMatch = zin.match(/\d+/g);
                if (!getallenMatch) return;
                let basisGetal = parseInt(getallenMatch[getallenMatch.length - 1], 10);
                gegooideScore = basisGetal * vermenigvuldiger;
            }

            if (gegooideScore > 180) return;

            // Opslaan voor Undo
            geschiedenisStappen.push({
                scores: { ...scores },
                legs: { ...legs },
                sets: { ...sets },
                actieveSpeler: actieveSpeler,
                htmlP1: document.getElementById('historyListP1').innerHTML,
                htmlP2: document.getElementById('historyListP2').innerHTML
            });

            let huidigeScore = (doelSpeler === 1) ? scores.score1 : scores.score2;
            let nieuweScore = huidigeScore - gegooideScore;

            if (nieuweScore < 0 || nieuweScore === 1) {
                speakFeedback("Kapot!");
                toonMelding("Kapot! Score hersteld.", "#e74c3c");
                voegToeAanHistorie(doelSpeler, `${gegooideScore} - KAPOT`);
                updateScherm();
                return;
            }

            if (doelSpeler === 1) scores.score1 = nieuweScore;
            else scores.score2 = nieuweScore;

            voegToeAanHistorie(doelSpeler, `-${gegooideScore} (over: ${nieuweScore})`);

            // Check Leg / Set / Match Winst
            if (nieuweScore === 0) {
                if (doelSpeler === 1) legs.leg1++;
                else legs.leg2++;

                let setGewonnen = false;
                if (legs.leg1 >= 3) {
                    sets.set1++;
                    legs.leg1 = 0; legs.leg2 = 0;
                    setGewonnen = true;
                } else if (legs.leg2 >= 3) {
                    sets.set2++;
                    legs.leg1 = 0; legs.leg2 = 0;
                    setGewonnen = true;
                }

                // Check Wedstrijd Winst
                if (sets.set1 >= targetSets || sets.set2 >= targetSets) {
                    document.getElementById('winnerText').innerText = spelerNaamMooi.toUpperCase();
                    document.getElementById('winnerBanner').style.display = 'block';
                    speakFeedback(`${spelerNaamMooi} heeft de wedstrijd gewonnen!`);
                    toonMelding(`🏆 ${spelerNaamMooi} wint de wedstrijd!`, "#f39c12");
                    
                    // Verwerk Winst in Head-to-Head Statistieken
                    let verliezer = (doelSpeler === 1) ? spelers.name2Mooi : spelers.name1Mooi;
                    registreerWinst(spelerNaamMooi, verliezer);

                    wisseGeschiedenis(); // Automatisch wissen bij einde wedstrijd
                    updateScherm();
                    return;
                }

                // Reset scores voor volgende Leg
                let startScore = parseInt(huidigSpel, 10);
                scores.score1 = startScore;
                scores.score2 = startScore;

                wisseGeschiedenis(); // AUTOMATISCH WISSEN bij nieuwe leg/set!

                if (setGewonnen) {
                    speakFeedback(`${spelerNaamMooi} wint de set!`);
                    toonMelding(`🏆 ${spelerNaamMooi} wint de set! Geschiedenis gewist.`, "#f39c12");
                } else {
                    speakFeedback(`${spelerNaamMooi} wint de leg!`);
                    toonMelding(`🎯 ${spelerNaamMooi} wint de leg! Geschiedenis gewist.`, "#2ecc71");
                }
            } else {
                toonMelding(`✓ ${gegooideScore} verwerkt voor ${spelerNaamMooi}`, "#2ecc71");
                if (gegooideScore === 180) speak180();
                else speakFeedback(gegooideScore.toString());
            }

            updateScherm();
        }

        function laatsteActieTerugdraaien() {
            if (geschiedenisStappen.length === 0) {
                toonMelding("Kan niet verder terug.", "#e74c3c");
                speakFeedback("Kan niet terug");
                return;
            }

            let vorigeStaat = geschiedenisStappen.pop();
            scores = { ...vorigeStaat.scores };
            legs = { ...vorigeStaat.legs };
            sets = { ...vorigeStaat.sets };
            actieveSpeler = vorigeStaat.actieveSpeler;
            document.getElementById('historyListP1').innerHTML = vorigeStaat.htmlP1;
            document.getElementById('historyListP2').innerHTML = vorigeStaat.htmlP2;
            document.getElementById('winnerBanner').style.display = 'none';

            updateScherm();
            toonMelding("↩️ Vorige actie hersteld!", "#e67e22");
            speakFeedback("Hersteld");
        }

        function wisseGeschiedenis() {
            document.getElementById('historyListP1').innerHTML = '<li style="color: #666;">Nog niks gegooid</li>';
            document.getElementById('historyListP2').innerHTML = '<li style="color: #666;">Nog niks gegooid</li>';
        }

        function updateScherm() {
            document.getElementById('scoreP1').innerText = scores.score1;
            document.getElementById('scoreP2').innerText = scores.score2;
            document.getElementById('legsP1').innerText = legs.leg1;
            document.getElementById('legsP2').innerText = legs.leg2;
            document.getElementById('setsP1').innerText = sets.set1;
            document.getElementById('setsP2').innerText = sets.set2;

            document.getElementById('checkoutP1').innerText = checkouts[scores.score1] || "-";
            document.getElementById('checkoutP2').innerText = checkouts[scores.score2] || "-";

            document.getElementById('rowP1').classList.toggle('active', actieveSpeler === 1);
            document.getElementById('rowP2').classList.toggle('active', actieveSpeler === 2);
        }

        function toonMelding(tekst, kleur = "#bdc3c7") {
            const statusEl = document.getElementById('status');
            statusEl.innerText = tekst;
            statusEl.style.color = kleur;
        }

        function voegToeAanHistorie(spelerNummer, tekst) {
            const listId = spelerNummer === 1 ? 'historyListP1' : 'historyListP2';
            const list = document.getElementById(listId);
            if (list.children.length === 1 && list.children[0].innerText.includes("Nog niks")) {
                list.innerHTML = "";
            }
            const li = document.createElement('li');
            li.innerHTML = tekst;
            list.insertBefore(li, list.firstChild);
        }

        function speakFeedback(tekst) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(tekst);
                utterance.lang = 'nl-NL';
                window.speechSynthesis.speak(utterance);
            }
        }

        function speak180() {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance("One hundred and eighty!!!");
                utterance.lang = 'en-GB';
                utterance.rate = 1.1;
                utterance.pitch = 1.2;
                window.speechSynthesis.speak(utterance);
            }
        }

        function resetSpel() {
            let startScore = parseInt(huidigSpel, 10);
            scores.score1 = startScore;
            scores.score2 = startScore;
            wisseGeschiedenis();
            updateScherm();
            document.getElementById('transcript').innerText = "Leg gereset!";
            toonMelding("Leg gereset en geschiedenis gewist.", "#8e44ad");
        }

        /* --- HEAD-TO-HEAD STATISTIEKEN LOGICA --- */
        function registreerWinst(winnaar, verliezer) {
            let stats = JSON.parse(localStorage.getItem('dart_head_to_head') || '{}');
            
            // Sleutel maken op alfabetische volgorde voor unieke koppels (bijv: "frans vs patrick")
            let spelerA = winnaar.toLowerCase();
            let spelerB = verliezer.toLowerCase();
            let matchKey = [spelerA, spelerB].sort().join(" vs ");

            if (!stats[matchKey]) {
                stats[matchKey] = { [spelerA]: 0, [spelerB]: 0, gespeeld: 0 };
            }

            stats[matchKey][spelerA] = (stats[matchKey][spelerA] || 0) + 1;
            stats[matchKey].gespeeld = (stats[matchKey].gespeeld || 0) + 1;

            localStorage.setItem('dart_head_to_head', JSON.stringify(stats));
        }

        function openStatsModal() {
            let stats = JSON.parse(localStorage.getItem('dart_head_to_head') || '{}');
            let bodyEl = document.getElementById('statsBody');
            
            let p1 = spelers.name1Mooi;
            let p2 = spelers.name2Mooi;
            let matchKey = [spelers.name1, spelers.name2].sort().join(" vs ");

            let html = `<p style="font-size: 14px; color: #ddd; margin-bottom: 10px;">Onderlinge balans voor: <strong>${p1} vs ${p2}</strong></p>`;

            if (stats[matchKey]) {
                let p1Wins = stats[matchKey][spelers.name1] || 0;
                let p2Wins = stats[matchKey][spelers.name2] || 0;
                let totaal = stats[matchKey].gespeeld || (p1Wins + p2Wins);

                html += `
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>Speler</th>
                                <th>Gewonnen</th>
                                <th>Verloren</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td style="text-align:left; font-weight:bold; color:#f39c12;">${p1}</td>
                                <td>${p1Wins}</td>
                                <td>${p2Wins}</td>
                            </tr>
                            <tr>
                                <td style="text-align:left; font-weight:bold; color:#f39c12;">${p2}</td>
                                <td>${p2Wins}</td>
                                <td>${p1Wins}</td>
                            </tr>
                        </tbody>
                    </table>
                    <p style="font-size: 12px; color: #888; margin-top: 12px; text-align: center;">Totaal gespeeld: ${totaal} wedstrijd(en)</p>
                `;
            } else {
                html += `<p style="color: #aaa; font-style: italic; font-size: 13px;">Nog geen eerdere wedstrijden opgeslagen tussen ${p1} en ${p2}.</p>`;
            }

            html += `<button onclick="resetH2H('${matchKey}')" style="background:#c0392b; font-size:12px; margin-top:15px; width:100%;">Stand Wissen voor deze spelers 🗑️</button>`;

            bodyEl.innerHTML = html;
            document.getElementById('statsModal').style.display = 'flex';
        }

        function closeStatsModal() {
            document.getElementById('statsModal').style.display = 'none';
        }

        function resetH2H(key) {
            if (confirm("Weet je zeker dat je de onderlinge stand voor deze spelers wilt wissen?")) {
                let stats = JSON.parse(localStorage.getItem('dart_head_to_head') || '{}');
                delete stats[key];
                localStorage.setItem('dart_head_to_head', JSON.stringify(stats));
                openStatsModal();
            }
        }
    </script>
</body>
</html>
